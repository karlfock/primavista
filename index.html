<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PrimaVista — Note Reading Trainer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>PrimaVista</h1>
  <p class="tagline">Sight-reading drill: name the note, play the key.</p>
</header>

<main>
  <section class="midi-panel">
    <label for="midi-device">MIDI input</label>
    <select id="midi-device" disabled>
      <option value="">No devices found</option>
    </select>
    <span id="midi-status" class="status">Requesting MIDI access…</span>
  </section>

  <section id="staff-panel" class="staff-panel">
    <div id="flash-overlay" class="flash-overlay"></div>
    <div id="corrective-feedback" class="corrective-feedback hidden"></div>
    <div id="staff"></div>
  </section>

  <section id="stats-panel" class="stats-panel">
    <div class="stat">
      <span class="stat-value" id="stat-attempts">0</span>
      <span class="stat-label">Attempts</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-correct">0</span>
      <span class="stat-label">Correct (1st try)</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-accuracy">—</span>
      <span class="stat-label">Accuracy</span>
    </div>
    <div class="stat">
      <span class="stat-value" id="stat-avg-time">—</span>
      <span class="stat-label">Avg response</span>
    </div>
  </section>

  <section id="summary-panel" class="summary-panel hidden">
    <h2>Session complete</h2>
    <p class="summary-score"><span id="summary-correct">0</span>/<span id="summary-total">25</span> correct on first try</p>
    <p class="summary-avg">Avg response: <span id="summary-avg-time">—</span></p>
    <button id="play-again-btn" type="button">Play again</button>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/vexflow@4.2.5/build/cjs/vexflow.js"></script>
<script src="app.js"></script>
</body>
</html>
